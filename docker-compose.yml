version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/invora.db
      - GRAPH_TENANT_ID=${GRAPH_TENANT_ID}
      - GRAPH_CLIENT_ID=${GRAPH_CLIENT_ID}
      - GRAPH_CLIENT_SECRET=${GRAPH_CLIENT_SECRET}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
      - ML_ENABLED=${ML_ENABLED:-true}
      - ML_PROVIDER=${ML_PROVIDER:-mock}
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  addin:
    build:
      context: ./addin
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - API_BASE_URL=http://backend:3000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:

